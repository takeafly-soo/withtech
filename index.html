<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WithTech 테스트 페이지</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    font-family: 'Segoe UI', sans-serif;
    color: white;
    text-align: center;
  }
  .box {
    padding: 40px 60px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    backdrop-filter: blur(6px);
  }
  h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
  }
  p {
    font-size: 1.1em;
    opacity: 0.85;
  }
  button {
    margin-top: 20px;
    padding: 12px 24px;
    font-size: 1em;
    border: none;
    border-radius: 10px;
    background: #ffd166;
    color: #333;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover {
    background: #ffc233;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>🔧 WithTech</h1>
    <p>배포 테스트 페이지입니다. 이 화면이 보이면 성공!</p>
    <button onclick="alert('배포가 잘 되었습니다! 🎉')">클릭해보세요</button>
  </div>
</body>
</html>
